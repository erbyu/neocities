<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>erbyu</title>
    <link href="./default.css" rel="stylesheet" type="text/css" media="all">
    <style>
        body {
            margin:0;
            background-color: black;
        }
        .navbar-whole {
            position:fixed;
            width:100%;
            top:0;
            background-color: rgb(17, 17, 17);
            border-bottom: 1px solid rgba(255, 255, 255, 0.183);
            gap:-1px;
        }
        .navbar-wrapper {
            display:flex;
            width:70%;
            align-items: center;
            margin: 0 auto;
        }
        .navbar-button, .navbar-button_dropdown {
            padding:10px;
            padding-left:20px;
            padding-right:20px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.183);
            border-top: 0;
            border-bottom:0;
            color:white;
        }
        .navbar-button:hover, .navbar-button_dropdown:hover {
            background-color: rgba(255, 255, 255, 0.055);
        }
        .navbar-logo {
            margin-left:auto;
            padding:10px;
            color:white;
        }

        /* dropdowns, most of this is stolen from w3schools */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        
        .navbar-button_dropdown_content {
            background-color:rgb(32, 32, 32);
        }

        .navbar-button_dropdown_content a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .navbar-button_dropdown_content {
            display:none;
            position:absolute;
            min-width:160px;
            z-index:1;
        }
        .dropdown:hover .navbar-button_dropdown_content {display:block;}
        .navbar-button_dropdown_content a:hover {background-color: #343434;}
    </style>
</head>
<body>
    <nav class="navbar-whole">
    <nav class="navbar-wrapper">
        <a class="navbar-button" href="/">index</a>
        <a class="navbar-button" href="/music.html">music</a>
        <div class="dropdown">
            <a class="navbar-button_dropdown" href="#">ocs ▼</a>
            <div class="navbar-button_dropdown_content">
                <a href="#">Partiverse</a>
                <a href="#">AMALGA Project</a>
                <a href="#">Erbiverse</a>
            </div>
        </div>
    </nav>
    </nav>
</body>
</html>
